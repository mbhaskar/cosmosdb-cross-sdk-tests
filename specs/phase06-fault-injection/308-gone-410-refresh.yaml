id: "T-308"
phase: 6
section: "6.8"
title: "Synthetic PartitionKeyRangeGone (410/1002) surfaces without wedging the client"
description: |
  A single 410 Gone response (substatus 1002 = PartitionKeyRangeGone) is
  injected at the HTTP gateway layer by the mitmproxy addon
  (proxy/mitm/fault_addon.py, via the pluggable fault_engine registry).

  410 is *not* a parameterized 429: it carries a different substatus, no
  x-ms-retry-after-ms hint, and a different body. Both tested SDKs surface a
  synthetic gateway point-read 410 to the caller rather than transparently
  rerouting it. The scenario therefore verifies the real observed contract: the
  410/1002 is preserved, clearing the fault leaves the client usable, and the
  next read succeeds without recreating the client.

  Transparent routing-cache refresh after an actual partition split is covered
  separately by C-310 against the stateful in-memory emulator. A protocol proxy
  cannot reproduce the server topology transition that drives that SDK path.

  Layer-7 protocol fault: requires the emulator + mitmproxy stack
  (proxy/docker-compose.proxy.yaml, SDK endpoint -> :18091). Not runnable on the
  offline mock tier.
tags: [fault-injection, protocol, gone, "410", retry, cache-refresh, mitmproxy]
backends: [emulator, live]
runners: [python, java]

fault_injection:
  proxy: cosmos
  protocol: mitmproxy

fixture:
  database: "auto"
  container:
    id: "orders"
    partition_key: "/customerId"

timeline:
  - after: seed
    event: inject_fault
    args: { fault: gone_410, count: 1 }
  - after: read_through_gone
    event: fault_clear

steps:
  - id: seed
    action: create_item
    params: { item: { id: "o1", customerId: "cust-1", status: "active" } }
    expect: [ { type: ok } ]

  - id: read_through_gone
    action: read_item
    params: { id: "o1", partition_key: "cust-1" }
    expect:
      - { type: error_status, name: gone_is_preserved, value: 410 }

  - id: read_after_clear
    action: read_item
    params: { id: "o1", partition_key: "cust-1" }
    expect:
      - { type: ok, name: client_recovers_after_clear }
      - { type: field_equals, name: right_item, path: item.id, value: "o1" }
