name: Nightly (emulator)

# Runs the full matrix against the Linux Cosmos DB emulator on a schedule, plus
# on-demand. It starts the complete Docker fault stack (emulator + Toxiproxy +
# mitmproxy) so ordinary emulator scenarios and proxy-dependent C-220/T-3xx
# scenarios are exercised in the same integration run.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      languages:
        description: "Which SDK runner(s) to execute"
        type: choice
        options: [both, python, java]
        default: both
      divergence_check:
        description: "Fail when SDKs disagree (only applies when languages=both)"
        type: boolean
        default: true

jobs:
  emulator-matrix:
    runs-on: ubuntu-latest
    env:
      LANGUAGES: ${{ github.event.inputs.languages || 'both' }}
      DIVERGENCE: ${{ github.event.inputs.divergence_check || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install -r harness/python/requirements.txt

      - name: Set up Java
        if: ${{ env.LANGUAGES != 'python' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Java runner
        if: ${{ env.LANGUAGES != 'python' }}
        run: cd harness/java && mvn -q -DskipTests package

      # C-220 and T-301..T-308 require the complete proxy chain, not only the
      # emulator. The helper waits until emulator, Toxiproxy, and mitmproxy are
      # all reachable and fails with stack logs if any component cannot start.
      - name: Start emulator + fault proxies
        run: scripts/run-fault-stack.sh up

      - name: Build Java trust store
        if: ${{ env.LANGUAGES != 'python' }}
        run: |
          scripts/build-java-truststore.sh
          "$JAVA_HOME/bin/keytool" -list \
            -keystore build/java-cosmos-truststore.jks \
            -storepass changeit \
            -alias mitmproxy-ca >/dev/null

      - name: Run scenario matrix (emulator)
        run: |
          python scripts/run-matrix.py \
            --backend emulator \
            --sdks "$LANGUAGES" \
            --out results/

      - name: Compare SDKs (divergence gate)
        if: ${{ always() && env.LANGUAGES == 'both' }}
        run: |
          FLAG=""
          if [ "$DIVERGENCE" = "true" ]; then FLAG="--fail-on-divergence"; fi
          python scripts/compare.py results/ -o report.md $FLAG

      - name: Single-SDK report
        if: ${{ always() && env.LANGUAGES != 'both' }}
        run: python scripts/compare.py results/ -o report.md

      - name: Upload results + report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-matrix-${{ env.LANGUAGES }}
          path: |
            results/
            report.md
          if-no-files-found: warn

      - name: Stop emulator + fault proxies
        if: ${{ always() }}
        run: scripts/run-fault-stack.sh down
